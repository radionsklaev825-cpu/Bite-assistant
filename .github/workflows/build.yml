name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Скачать русскую модель Vosk
        run: |
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q model.zip
          mv vosk-model-small-ru-0.22 model
          rm model.zip
          ls model

      - name: Buildozer
        run: |
          pip install --upgrade buildozer cython virtualenv
          buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: byte-apk
          path: bin/*.apk
