name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Скачать русскую модель Vosk
        run: |
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          ls -l model.zip
          unzip -l model.zip | tail -3

      - name: Buildozer
        shell: bash
        run: |
          pip install --upgrade buildozer cython virtualenv
          buildozer -v android debug 2>&1 | tee build.log

      - name: Причина ошибки
        if: failure()
        shell: bash
        run: |
          N=$(grep -n "gradlew failed" build.log | tail -1 | cut -d: -f1)
          if [ -n "$N" ]; then sed -n "$((N-60)),$((N))p" build.log | cut -c1-220; fi

      - name: Полный лог файлом
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: byte-apk
          path: bin/*.apk
